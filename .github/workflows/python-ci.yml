name: Python CI

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/python-ci.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every service
        run: python -m compileall -q services

  ai-backend:
    runs-on: ubuntu-latest
    needs: syntax
    defaults:
      run:
        working-directory: services/ai-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import the app
        run: python -c "from app.main import app; print(len(app.routes), 'routes')"
