version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directories:
      - "/services/ai-backend"
      - "/services/clip-service"
      - "/services/face-service"
      - "/services/image-service"
      - "/services/speaker-service"
      - "/services/translate-service"
      - "/services/tts-service"
      - "/services/turboquant-service"
      - "/services/whisper-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
